# =============================================================================
# RTK Spline + MPPI Local Deviation Demo
# 全局路径保持 RTK 样条不变，局部 MPPI 根据 local costmap 绕障后重新汇入。
# =============================================================================

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_remove_passed_goals_action_bt_node

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["RtkSplinePlanner"]

    RtkSplinePlanner:
      plugin: "nav2_rtk_spline_planner/RtkSplinePlanner"
      path_resolution: 0.2
      search_radius: -1.0
      use_waypoint_topic: true
      waypoint_topic: "rtk_waypoints"
      # Local Deviation 模式：全局样条不因局部障碍而改变或失败。
      check_costmap_collision: false

controller_server:
  ros__parameters:
    use_sim_time: false
    # 当前 CPU 在 20 Hz + 大批量采样下持续超时，改为可稳定执行的 10 Hz。
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 60.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 1.0
      yaw_goal_tolerance: 0.5
      stateful: true

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "DiffDrive"
      # 仍保持 8 s 预测窗口，但将离散步长与 10 Hz 控制周期匹配。
      time_steps: 80
      model_dt: 0.1
      batch_size: 4000
      iteration_count: 1
      vx_std: 0.25
      vy_std: 0.0
      # 降低角速度采样幅度，减少窄通道入口处左右反复试探。
      wz_std: 0.5
      vx_max: 0.8
      # 演示路线不需要倒车；禁止负速度可避免局部回环。
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 1.2
      # 对不对称通道作出明确选择，避免两侧候选控制量相互抵消。
      temperature: 0.1
      gamma: 0.015
      prune_distance: 3.0
      transform_tolerance: 0.3
      retry_attempt_limit: 3
      regenerate_noises: true
      # 发布全部候选轨迹会显著拖慢控制循环；实际绕行轨迹仍由
      # /actual_trajectory 显示。
      visualize: false

      TrajectoryVisualizer:
        trajectory_step: 10
        time_step: 4

      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PreferForwardCritic

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: true
        cost_power: 1
        # 碰撞仍施加百万级代价，但降低普通膨胀区代价以允许穿过窄缝。
        cost_weight: 1.5
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 100000000.0
        near_goal_distance: 1.0

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 5.0

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 1.0

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 1.0
        offset_from_furthest: 8
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        # 过大的跟随权重会让控制器在障碍前反复冲向被占用的样条。
        cost_weight: 6.0
        offset_from_furthest: 10
        threshold_to_consider: 1.0

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        offset_from_furthest: 4
        threshold_to_consider: 1.0
        max_angle_to_furthest: 1.0
        forward_preference: true

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 1.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.5
      rolling_window: true
      width: 600
      height: 300
      resolution: 0.5
      always_send_full_costmap: true
      track_unknown_space: false
      transform_tolerance: 0.5
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: demo_obstacles
        demo_obstacles:
          topic: /demo_obstacles
          data_type: "PointCloud2"
          marking: true
          clearing: false
          min_obstacle_height: 0.0
          max_obstacle_height: 2.5
          obstacle_max_range: 500.0
          raytrace_max_range: 500.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.6
        cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      robot_radius: 0.5
      rolling_window: true
      width: 30
      height: 20
      resolution: 0.1
      always_send_full_costmap: true
      transform_tolerance: 0.5
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: demo_obstacles
        demo_obstacles:
          topic: /demo_obstacles
          data_type: "PointCloud2"
          marking: true
          clearing: false
          min_obstacle_height: 0.0
          max_obstacle_height: 2.5
          obstacle_max_range: 500.0
          raytrace_max_range: 500.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 过大会把 1.6 m 级窄缝完全封死，导致 MPPI 在入口振荡。
        inflation_radius: 0.4
        cost_scaling_factor: 8.0

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - bt_navigator
    bond_timeout: 0.0
