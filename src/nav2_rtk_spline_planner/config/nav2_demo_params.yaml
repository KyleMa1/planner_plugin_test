# =============================================================================
# RTK Spline Planner Demo — Nav2 最小参数配置
#
# 包含：planner_server + global_costmap + lifecycle_manager
# 不需要 map_server / amcl / controller — 仅演示 planner 功能
# =============================================================================

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planner_plugins: ["RtkSplinePlanner"]

    RtkSplinePlanner:
      plugin: "nav2_rtk_spline_planner/RtkSplinePlanner"
      path_resolution: 0.5
      search_radius: -1.0
      use_waypoint_topic: true
      waypoint_topic: "rtk_waypoints"
      check_costmap_collision: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.5
      rolling_window: true
      width: 600
      height: 300
      resolution: 1.0
      always_send_full_costmap: true
      track_unknown_space: false
      transform_tolerance: 0.3
      # 仅使用 inflation_layer — 无需传感器数据，isCurrent() 始终 true
      plugins: ["inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5
        cost_scaling_factor: 3.0

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["planner_server"]
    bond_timeout: 0.0
